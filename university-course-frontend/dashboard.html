<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      background-color: #f5f5f5;
    }
    h1 {
      text-align: center;
      margin-bottom: 10px;
    }
    #welcome {
      text-align: center;
      font-size: 18px;
      margin-bottom: 30px;
      color: #333;
    }
    .nav-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }
    .nav-card {
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 10px #ccc;
      text-align: center;
      cursor: pointer;
      transition: 0.3s;
    }
    .nav-card:hover {
      background-color: #e6f7ff;
    }
    .logout {
      margin-top: 30px;
      text-align: center;
    }
    .logout button {
      padding: 10px 20px;
      background: red;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <h1>🎓 University Course Management</h1>
  <div id="welcome"></div>

  <!-- Navigation Cards -->
  <div class="nav-container" id="adminLinks">
    <div class="nav-card" onclick="navigate('students.html')">👩‍🎓 Students</div>
    <div class="nav-card" onclick="navigate('faculty.html')">👨‍🏫 Faculty</div>
    <div class="nav-card" onclick="navigate('courses.html')">📚 Courses</div>
    <div class="nav-card" onclick="navigate('enrollments.html')">📝 Enrollments</div>
    <div class="nav-card" onclick="navigate('results.html')">📊 Results</div>
    <div class="nav-card" onclick="navigate('teaches.html')">📖 Teaches</div>
    <div class="nav-card" onclick="navigate('departments.html')">🏫 Departments</div>
    <div class="nav-card" onclick="navigate('users.html')">👥 Users</div>
  </div>


  <!-- Logout -->
  <div class="logout">
    <button onclick="logout()">🔓 Logout</button>
  </div>

  <script>
    const user = JSON.parse(localStorage.getItem('loggedInUser'));
    if (!user) {
      window.location.href = 'login.html';
    }

    document.getElementById('welcome').innerText = `Welcome, ${user.username} (${user.role})`;

    if (user.role === 'admin') {
      document.getElementById('adminLinks').classList.remove('hidden');
    } else {
      document.getElementById('userLinks').classList.remove('hidden');
    }

    function navigate(page) {
      window.location.href = page;
    }

    function logout() {
      localStorage.removeItem('loggedInUser');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
