<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Results Management</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    h1 { color: #333; }
    input, button { margin: 5px; padding: 6px; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { padding: 8px; border: 1px solid #999; text-align: center; }
    button { cursor: pointer; }
  </style>
</head>
<body>
  <h1>📊 Student Results</h1>

  <form id="resultForm">
    <input type="number" id="student_id" placeholder="Student ID" required />
    <input type="number" id="course_id" placeholder="Course ID" required />
    <input type="text" id="grade" placeholder="Grade (e.g., A+)" required />
    <input type="number" id="marks" placeholder="Marks" required />
    <button type="submit">Add / Update</button>
  </form>

  <table>
    <thead>
      <tr>
        <th>Student ID</th>
        <th>Course ID</th>
        <th>Grade</th>
        <th>Marks</th>
      </tr>
    </thead>
    <tbody id="resultsTable"></tbody>
  </table>

  <script src="js/results.js"></script>
  <script>
  const user = JSON.parse(localStorage.getItem('loggedInUser'));
  if (!user || user.role !== 'admin') {
    window.location.href = 'unauthorized.html';
  }
</script>

</body>
</html>
