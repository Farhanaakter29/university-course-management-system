<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Management</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body {
      font-family: Arial;
      padding: 20px;
    }

    h1 {
      color: #222;
    }

    form {
      margin-bottom: 20px;
    }

    form input {
      padding: 5px;
      margin: 5px;
      width: 180px;
    }

    form button {
      padding: 6px 12px;
      background-color: green;
      color: white;
      border: none;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 8px;
      border: 1px solid #aaa;
      text-align: left;
    }

    td button {
      margin: 0 2px;
      padding: 5px;
      border: none;
      background-color: transparent;
      cursor: pointer;
    }

    td button:hover {
      transform: scale(1.2);
    }

    td button:first-child {
      color: green;
    }

    td button:last-child {
      color: red;
    }
  </style>
</head>
<body>
  <h1>🎓 Student Management</h1>

  <!-- Add / Update Student -->
  <form id="studentForm">
    <input type="hidden" id="student_id" />
    <input type="text" id="name" placeholder="Name" required />
    <input type="email" id="email" placeholder="Email" required />
    <input type="text" id="phone" placeholder="Phone" required />
    <input type="number" id="dept_id" placeholder="Dept ID" required />
    <button type="submit">Save</button>
  </form>

  <table>
    <thead>
      <tr>
        <th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Dept</th><th>Actions</th>
      </tr>
    </thead>
    <tbody id="studentTable"></tbody>
  </table>

  <script src="js/students.js"></script>

  <!-- 🔒 Admin Access Only -->
  <script>
    const user = JSON.parse(localStorage.getItem('loggedInUser'));
    if (!user || user.role !== 'admin') {
      window.location.href = 'unauthorized.html';
    }
  </script>
</body>
</html>
